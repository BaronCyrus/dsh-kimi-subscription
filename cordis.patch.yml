# Register the dedicated Kimi Code subscription route and its settings surface.
# The route is intentionally separate from llm-pi-ai's kimi-coding API-key route.
- insert:
    - id: kimi-subscription
      name: 'dsh-kimi-subscription'

# DSH 0.1.5-alpha.1 registers RPC routes through the Connection owner's
# webServer but no longer declares that dependency. Loader entry injections
# augment the module's own inject list (including credentials), but REPLACE
# the row's inject list: preserve webRuntime for trustedHosts interpolation.
# The name guard leaves replacement Connection implementations untouched.
# Older supported web profiles also provide both services.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime, webServer]
