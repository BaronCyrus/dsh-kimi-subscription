name: Bug report
description: Report an installation, login, model, or quota problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API keys, access tokens, refresh tokens, raw credential files, or private prompts."
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node.js version
      placeholder: macOS 15 / Node.js 22.20.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or update
        - API-key login
        - OAuth device login
        - Model request
        - Settings quota
        - Composer quota
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use fake placeholders for every credential.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, account identifiers, and private prompts.
          required: true
